<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azzam Technology | لوحة التحكم المتقدمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c92a37;
            --primary-light: #ff6b6b;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --card: #1a2332;
            --glass: rgba(26, 35, 50, 0.9);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #263348;
            --border-light: #1e2d42;
            --shadow: 0 4px 16px rgba(0,0,0,0.2);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 30px rgba(230,57,70,0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 280px;
            --font: 'Tajawal', sans-serif;
            --gradient-accent: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            --gradient-sidebar: linear-gradient(180deg, #0a0f1a 0%, #111827 50%, #0d1525 100%);
            --gradient-card: linear-gradient(145deg, #1a2332 0%, #15202d 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-accent); border-radius: 10px; }

        .login-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0e17 100%);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .login-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-card {
            background: var(--gradient-card); border-radius: 24px; padding: 48px 36px;
            text-align: center; max-width: 440px; width: 90%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: loginSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }
        @keyframes loginSlideIn {
            from { opacity: 0; transform: translateY(40px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-card .login-logo {
            width: 80px; height: 80px; background: var(--gradient-accent);
            border-radius: 20px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 2rem; color: #fff;
            margin-bottom: 20px; box-shadow: 0 12px 30px rgba(230,57,70,0.5);
        }
        .login-card h2 { font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
        .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }
        
        /* GitHub Button */
        .github-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 14px; border: 2px solid #30363d;
            border-radius: 14px; background: #24292f; cursor: pointer;
            font-weight: 700; font-size: 1rem; font-family: var(--font); color: #fff;
            transition: all 0.3s;
        }
        .github-btn:hover { 
            background: #2d3748; 
            border-color: #6e7681; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }
        
        .login-card .divider {
            display: flex; align-items: center; text-align: center; margin: 24px 0;
            color: var(--text-muted); font-size: 0.8rem;
        }
        .login-card .divider::before, .login-card .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border);
        }
        .login-card .divider::before { margin-left: 12px; }
        .login-card .divider::after { margin-right: 12px; }
        .login-card .skip-btn {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            cursor: pointer; font-family: var(--font); font-size: 0.9rem;
            padding: 10px 20px; border-radius: 10px; transition: all 0.2s;
        }
        .login-card .skip-btn:hover { color: #fff; border-color: var(--primary); }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 14px; display: none; }
        .error-msg.show { display: block; }

        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-width); background: var(--gradient-sidebar);
            color: #fff; position: fixed; top: 0; right: 0; height: 100vh;
            z-index: 100; display: flex; flex-direction: column;
            transition: transform var(--transition); overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border);
        }
        .sidebar-header {
            padding: 28px 24px 20px; border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar-header .logo-icon {
            width: 56px; height: 56px; background: var(--gradient-accent);
            border-radius: 16px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 1.5rem; margin-bottom: 8px;
            box-shadow: 0 8px 24px rgba(230,57,70,0.4);
        }
        .sidebar-header .logo-text { font-size: 1.2rem; font-weight: 900; }
        .sidebar-header .logo-sub { font-size: 0.7rem; color: var(--text-muted); }
        
        .user-info {
            display: flex; align-items: center; gap: 10px;
            padding: 14px; margin: 12px; background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm); border: 1px solid var(--border);
        }
        .user-info img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); }
        .user-info .user-details { flex: 1; min-width: 0; }
        .user-info .user-name { color: #fff; font-weight: 700; font-size: 0.85rem; }
        .user-info .user-email { color: var(--text-muted); font-size: 0.7rem; }
        .logout-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: #fff; cursor: pointer; padding: 6px 12px; border-radius: 8px;
            font-family: var(--font); font-size: 0.75rem; transition: all 0.2s;
        }
        .logout-btn:hover { background: var(--primary); border-color: var(--primary); }

        .sidebar-nav { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px; padding: 12px 18px;
            color: var(--text-muted); text-decoration: none; border-radius: 12px;
            transition: var(--transition); font-weight: 500; font-size: 0.9rem;
            cursor: pointer; position: relative;
        }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .sidebar-nav a.active {
            background: var(--gradient-accent); color: #fff;
            box-shadow: 0 6px 20px rgba(230,57,70,0.4);
        }
        .sidebar-nav a i { width: 22px; text-align: center; font-size: 1rem; }
        .sidebar-nav a .badge-nav {
            position: absolute; left: 12px; background: #22c55e; color: #fff;
            font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 700;
        }

        .sidebar-footer {
            padding: 16px; border-top: 1px solid var(--border);
            font-size: 0.8rem; color: var(--text-muted); text-align: center;
        }
        .sidebar-footer a { color: var(--text-muted); text-decoration: none; display: block; margin-bottom: 4px; }
        .sidebar-footer a:hover { color: #fff; }

        .main-content {
            flex: 1; margin-right: var(--sidebar-width);
            padding: 28px; min-height: 100vh;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
        }
        .top-bar h2 { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .top-bar h2 i { color: var(--primary-light); }
        .top-bar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--gradient-card); padding: 24px;
            border-radius: var(--radius); border: 1px solid var(--border);
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .stat-card::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(230,57,70,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
        .stat-card .stat-icon { font-size: 1.8rem; margin-bottom: 10px; position: relative; z-index: 1; }
        .stat-card .stat-number { font-size: 2.2rem; font-weight: 900; color: var(--primary-light); position: relative; z-index: 1; }
        .stat-card .stat-label { color: var(--text-muted); font-size: 0.85rem; position: relative; z-index: 1; }
        .stat-card .stat-change { font-size: 0.75rem; color: #22c55e; position: relative; z-index: 1; }

        .panel {
            background: var(--gradient-card); border-radius: var(--radius);
            padding: 28px; border: 1px solid var(--border);
            display: none; animation: fadeSlide 0.4s ease;
            box-shadow: var(--shadow);
        }
        .panel.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 10px 22px; border: none; border-radius: 10px;
            cursor: pointer; font-weight: 700; font-size: 0.85rem;
            transition: var(--transition); display: inline-flex; align-items: center;
            gap: 8px; font-family: inherit; white-space: nowrap;
        }
        .btn-primary { background: var(--gradient-accent); color: #fff; box-shadow: 0 4px 16px rgba(230,57,70,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,57,70,0.5); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
        .btn-xs { padding: 4px 10px; font-size: 0.7rem; border-radius: 6px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); }
        .form-control {
            width: 100%; padding: 10px 16px; border: 1.5px solid var(--border);
            border-radius: 10px; font-size: 0.9rem; font-family: inherit;
            transition: var(--transition); background: var(--bg-secondary); color: var(--text);
        }
        .form-control:focus {
            border-color: var(--primary); outline: none;
            box-shadow: 0 0 0 3px rgba(230,57,70,0.15);
            background: var(--bg);
        }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .table-container { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 16px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-secondary); font-weight: 700; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .product-thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
        .badge {
            padding: 4px 12px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 700; display: inline-block;
        }
        .badge-laptop { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .badge-monitor { background: rgba(34,197,94,0.2); color: #4ade80; }
        .badge-pc { background: rgba(168,85,247,0.2); color: #c084fc; }
        .badge-component { background: rgba(251,146,60,0.2); color: #fb923c; }
        .badge-active { background: rgba(34,197,94,0.2); color: #4ade80; }
        .badge-inactive { background: rgba(239,68,68,0.2); color: #f87171; }
        .stock-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; }
        .stock-high { background: #22c55e; }
        .stock-low { background: #f59e0b; }
        .stock-out { background: #ef4444; }

        .image-upload-area {
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 24px; text-align: center; cursor: pointer;
            transition: var(--transition); background: var(--bg-secondary);
            position: relative; min-height: 140px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px;
        }
        .image-upload-area:hover { border-color: var(--primary); background: rgba(230,57,70,0.05); }
        .image-upload-area.has-image { border-style: solid; border-color: #22c55e; }
        .image-upload-area i { font-size: 2.5rem; color: var(--text-muted); }
        .image-upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .image-preview-container { display: none; margin-top: 14px; }
        .image-preview-container.show { display: block; }
        .image-preview { max-width: 100%; max-height: 280px; border-radius: var(--radius-sm); border: 1px solid var(--border); }

        .coupon-card {
            background: var(--bg-secondary); padding: 16px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 10px; transition: var(--transition);
        }
        .coupon-card:hover { border-color: var(--primary); }
        .coupon-code-display {
            font-family: monospace; font-size: 1.1rem; font-weight: 700;
            background: var(--bg); padding: 6px 16px; border-radius: 8px;
            border: 1px dashed var(--border); letter-spacing: 1px;
        }

        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff;
            padding: 14px 28px; border-radius: 30px; z-index: 9999;
            font-weight: 600; box-shadow: 0 12px 36px rgba(0,0,0,0.4);
            animation: slideUp 0.4s ease; display: none; border: 1px solid var(--border);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .empty-state { text-align: center; padding: 50px; color: var(--text-muted); }
        .empty-state i { font-size: 4rem; margin-bottom: 16px; opacity: 0.3; }

        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .form-row { grid-template-columns: 1fr; }
            .mobile-menu-btn { display: flex !important; }
        }
        .mobile-menu-btn {
            display: none; position: fixed; top: 14px; right: 14px; z-index: 200;
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--gradient-accent); color: #fff; border: none;
            cursor: pointer; font-size: 1.2rem; box-shadow: 0 6px 20px rgba(230,57,70,0.4);
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: 99; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show { display: block; }
    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
            <h2>لوحة التحكم</h2>
            <p>Azzam Technology - دخول آمن</p>
            
            <!-- GitHub Login Button -->
            <button class="github-btn" id="github-login-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="fas fa-microchip"></i></div>
                <div class="logo-text">Azzam Technology</div>

            <div class="user-info" id="user-info-sidebar" style="display:none;">
                <img id="user-avatar" src="" alt="User">

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== إعدادات GitHub ====================
            const GITHUB_CLIENT_ID = 'Ov23liGApsfGjqopAY4s'; // Client ID الخاص بك
            
            const AUTHORIZED_GITHUB_USERS = [
                'codzilla01',
            ];

            const STORAGE_KEY = 'store_all_products';
            const AUTH_KEY = 'azzam_admin_auth';

            let products = [];
            let currentUser = null;

            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);

            function showToast(msg, isError = false) {
                const toast = $('#toast');
                toast.textContent = msg;
                toast.style.background = isError ? '#dc3545' : 'linear-gradient(135deg, #1a1a2e, #16213e)';
                toast.style.display = 'block';
                clearTimeout(toast._t);
                toast._t = setTimeout(() => toast.style.display = 'none', 3000);
            }

            function formatPrice(p) { return p.toLocaleString('en-US') + ' ج.م'; }

            // ==================== GITHUB AUTH ====================
            function loginWithGitHub() {
                console.log('🔑 Starting GitHub login...');
                
                if (!GITHUB_CLIENT_ID) {
                    showLoginError('الرجاء إعداد GitHub Client ID');
                    return;
                }

                const state = Math.random().toString(36).substring(2, 18);
                sessionStorage.setItem('github_oauth_state', state);

                const redirectUri = window.location.origin + window.location.pathname;
                
                const authUrl = 'https://github.com/login/oauth/authorize?' +
                    'client_id=' + encodeURIComponent(GITHUB_CLIENT_ID) +
                    '&redirect_uri=' + encodeURIComponent(redirectUri) +
                    '&scope=read:user' +
                    '&state=' + state +
                    '&allow_signup=false';

                console.log('🔗 Redirecting to:', authUrl);
                window.location.href = authUrl;
            }

            function handleGitHubCallback() {
                const params = new URL(window.location.href).searchParams;
                const code = params.get('code');
                const state = params.get('state');
                const error = params.get('error');

                if (error) {
                    showLoginError('تم رفض التفويض من GitHub');
                    cleanUrl();
                    return;
                }

                if (!code) return;

                const savedState = sessionStorage.getItem('github_oauth_state');
                if (state !== savedState) {
                    showLoginError('خطأ في التحقق من الأمان');
                    cleanUrl();
                    return;
                }

                cleanUrl();
                showToast('جاري تسجيل الدخول...');
                exchangeCodeForToken(code);
            }

            function cleanUrl() {
                if (window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }

            async function exchangeCodeForToken(code) {
                try {
                    // استخدام proxy للحصول على access token
                    const response = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(
                        'https://github.com/login/oauth/access_token'
                    ), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            client_id: GITHUB_CLIENT_ID,
                            code: code,
                            redirect_uri: window.location.origin + window.location.pathname
                        })
                    });

                    const data = await response.json();
                    console.log('Token response:', data);

                    if (data.access_token) {
                        await fetchGitHubUser(data.access_token);
                    } else {
                        console.error('No access token:', data);
                        showLoginError('فشل الحصول على رمز الدخول. تأكد من صحة Client ID');
                    }
                } catch (error) {
                    console.error('Exchange error:', error);
                    showLoginError('فشل الاتصال بـ GitHub. حاول مرة أخرى.');
                }
            }

            async function fetchGitHubUser(accessToken) {
                try {
                    const response = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(
                        'https://api.github.com/user'
                    ), {
                        headers: {
                            'Authorization': 'Bearer ' + accessToken,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (response.ok) {
                        const userData = await response.json();
                        console.log('User data:', userData);
                        processGitHubUser(userData);
                    } else {
                        showLoginError('فشل جلب معلومات المستخدم');
                    }
                } catch (error) {
                    console.error('Fetch user error:', error);
                    showLoginError('فشل الاتصال بـ GitHub API');
                }
            }

            function processGitHubUser(userData) {
                const username = userData.login;

                if (!AUTHORIZED_GITHUB_USERS.some(u => u.toLowerCase() === username.toLowerCase())) {
                    showLoginError('المستخدم "' + username + '" غير مصرح له بالدخول');
                    return;
                }

                currentUser = {
                    email: username + '@github.com',
                    name: userData.name || username,
                    picture: userData.avatar_url || '',
                    loginTime: new Date().toISOString(),
                    githubUsername: username
                };

                localStorage.setItem(AUTH_KEY, JSON.stringify(currentUser));
                hideLoginOverlay();
                updateUserInfo();
                showToast('مرحباً ' + currentUser.name + '! 🎉');
                loadData();
                refreshDashboard();
            }

            function showLoginError(msg) {
                const el = document.getElementById('login-error');
                el.textContent = msg;
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 5000);
            }

            function hideLoginOverlay() { 
                document.getElementById('login-overlay').classList.add('hidden'); 
            }
            
            function showLoginOverlay() { 
                document.getElementById('login-overlay').classList.remove('hidden'); 
            }

            function logout() {
                if (confirm('تسجيل الخروج؟')) {
                    localStorage.removeItem(AUTH_KEY);
                    currentUser = null;
                    showLoginOverlay();
                    updateUserInfo();
                    showToast('تم تسجيل الخروج');
                }
            }

            function updateUserInfo() {
                const sidebar = document.getElementById('user-info-sidebar');
                if (currentUser) {
                    sidebar.style.display = 'flex';
                    document.getElementById('user-avatar').src = currentUser.picture || '';
                    document.getElementById('user-name-display').textContent = currentUser.name;
                    document.getElementById('user-email-display').textContent = currentUser.githubUsername || '';
                } else {
                    sidebar.style.display = 'none';
                }
            }

            function checkAuth() {
                const stored = localStorage.getItem(AUTH_KEY);
                if (stored) {
                    try {
                        currentUser = JSON.parse(stored);
                        const hoursDiff = (new Date() - new Date(currentUser.loginTime)) / 3600000;
                        if (hoursDiff > 24) {
                            localStorage.removeItem(AUTH_KEY);
                            currentUser = null;
                        } else {
                            hideLoginOverlay();
                            updateUserInfo();
                            return true;
                        }
                    } catch(e) {
                        localStorage.removeItem(AUTH_KEY);
                    }
                }

                // Check for GitHub callback
                const params = new URL(window.location.href).searchParams;
                if (params.get('code')) {
                    handleGitHubCallback();
                    return false;
                }

                showLoginOverlay();
                return false;
            }

            function skipLogin() {
                currentUser = {
                    email: 'guest',
                    name: 'زائر',
                    picture: '',
                    loginTime: new Date().toISOString(),
                    isGuest: true
                };
                hideLoginOverlay();
                updateUserInfo();
                showToast('دخول محدود (زائر)');
            }

            // ==================== DATA ====================
            function loadData() {
                products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            }

            function refreshDashboard() {
                const tp = products.filter(p => p.type !== 'component');
                const tc = products.filter(p => p.type === 'component');
                const totalStock = products.reduce((s,p) => s + (p.stock || 0), 0);
                
                document.getElementById('dashboard-stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon">📦</div>
                        <div class="stat-number">${tp.length}</div>
                        <div class="stat-label">منتج</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🔧</div>
                        <div class="stat-number">${tc.length}</div>
                        <div class="stat-label">قطعة تجميع</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📊</div>
                        <div class="stat-number">${totalStock}</div>
                        <div class="stat-label">إجمالي المخزون</div>
                    </div>
                `;
            }

            // ==================== EVENTS ====================
            function bindEvents() {
                // GitHub Login Button
                const githubBtn = document.getElementById('github-login-btn');
                if (githubBtn) {
                    githubBtn.addEventListener('click', function() {
                        console.log('🖱️ GitHub button clicked!');
                        loginWithGitHub();
                    });
                    console.log('✅ GitHub button event bound');
                } else {
                    console.error('❌ GitHub button not found!');
                }

                // Skip Login Button
                const skipBtn = document.getElementById('skip-login-btn');
                if (skipBtn) {
                    skipBtn.addEventListener('click', skipLogin);
                }

                // Logout Button
                const logoutBtn = document.getElementById('logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', logout);
                }

                // Sidebar Navigation
                $$('.sidebar-nav a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const panel = link.dataset.panel;
                        $$('.panel').forEach(p => p.classList.remove('active'));
                        $$('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                        const targetPanel = document.getElementById('panel-' + panel);
                        if (targetPanel) targetPanel.classList.add('active');
                        link.classList.add('active');
                    });
                });

                // Mobile Menu
                const mobileBtn = document.getElementById('mobile-menu-btn');
                if (mobileBtn) {
                    mobileBtn.addEventListener('click', () => {
                        document.getElementById('sidebar').classList.add('open');
                        document.getElementById('sidebar-overlay').classList.add('show');
                    });
                }

                const overlay = document.getElementById('sidebar-overlay');
                if (overlay) {
                    overlay.addEventListener('click', () => {
                        document.getElementById('sidebar').classList.remove('open');
                        overlay.classList.remove('show');
                    });
                }
            }

            // ==================== INIT ====================
            function init() {
                console.log('🚀 Admin Panel Initializing...');
                console.log('📋 GitHub Client ID:', GITHUB_CLIENT_ID ? 'Set' : 'NOT SET');
                console.log('👥 Authorized Users:', AUTHORIZED_GITHUB_USERS.join(', '));
                
                bindEvents();
                
                const isAuth = checkAuth();
                if (isAuth) {
                    loadData();
                    refreshDashboard();
                }
                
                console.log('✅ Admin Panel Ready');
            }

            // Start the app
            init();
        })();
    </script>
</body>
</html>
