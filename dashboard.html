<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Azzam Technology | حسابي - تسجيل الدخول</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6edf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* بطاقة الحساب الرئيسية */
        .auth-container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 42px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* رأس الصفحة مع شعار */
        .auth-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 24px 24px;
            text-align: center;
            color: white;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .brand-logo i {
            font-size: 38px;
            color: #e63946;
            background: white;
            padding: 10px;
            border-radius: 28px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .brand-logo span {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 15px;
            opacity: 0.8;
            margin-top: 6px;
        }

        /* محتوى النماذج */
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #edf2f7;
            background: #fff;
            padding: 0 20px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 18px 8px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            color: #5a6874;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: #e63946;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 100%;
            height: 3px;
            background: #e63946;
            border-radius: 3px 3px 0 0;
        }

        .auth-form-panel {
            padding: 32px 28px 36px;
        }

        .form-card {
            display: none;
            animation: fadeSlide 0.25s ease-out;
        }

        .form-card.active-form {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* حقول الإدخال */
        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa9b7;
            font-size: 18px;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 15px 48px 15px 16px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            border: 1.5px solid #e2e8f0;
            border-radius: 28px;
            background: #fefefe;
            transition: all 0.2s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #e63946;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }

        /* حقل الكود المرسل */
        .otp-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .otp-wrapper input {
            flex: 1;
        }

        .send-otp-btn {
            background: #eef2ff;
            border: none;
            border-radius: 40px;
            padding: 0 18px;
            font-weight: 600;
            color: #e63946;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            height: 52px;
            font-size: 14px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .send-otp-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            width: 100%;
            background: #e63946;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #c92a37;
            transform: scale(0.98);
        }

        .btn-outline-google {
            width: 100%;
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            padding: 13px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            color: #2d3e50;
        }

        .btn-outline-google i {
            font-size: 20px;
            color: #4285F4;
        }

        .btn-outline-google:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 28px 0 18px;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before {
            margin-left: 12px;
        }
        .divider::after {
            margin-right: 12px;
        }

        .info-note {
            background: #fef9e6;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 13px;
            color: #b45309;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 20px;
        }

        .info-note i {
            font-size: 18px;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 420px;
            margin: 0 auto;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ربط مع المتجر */
        .back-link {
            text-align: center;
            margin-top: 18px;
        }
        .back-link a {
            color: #5a6874;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .back-link a:hover {
            color: #e63946;
        }

        @media (max-width: 520px) {
            .auth-form-panel {
                padding: 24px 20px;
            }
            .otp-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .send-otp-btn {
                width: 100%;
                justify-content: center;
            }
            .tab-btn {
                font-size: 16px;
                padding: 14px 5px;
            }
        }
    </style>
</head>
<body>

<div class="auth-container" id="authApp">
    <div class="auth-header">
        <div class="brand-logo">
            <i class="fas fa-laptop-code"></i>
            <span>Azzam Technology</span>
        </div>
        <p>مرحباً بك! سجل دخولك لتجربة تسوق مخصصة</p>
    </div>

    <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
        <button class="tab-btn" data-tab="register">إنشاء حساب</button>
    </div>

    <div class="auth-form-panel">
        <!-- نموذج تسجيل الدخول -->
        <div id="login-panel" class="form-card active-form">
            <div class="input-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="login-phone" placeholder="رقم الجوال (مثال: 010xxxxxxx)" dir="ltr">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="كلمة المرور">
            </div>
            <button class="btn-primary" id="login-with-pass-btn">
                <i class="fas fa-sign-in-alt"></i> دخول
            </button>

            <div class="divider">أو</div>

            <button class="btn-outline-google" id="google-login-btn">
                <i class="fab fa-google"></i> تسجيل الدخول بحساب Google
            </button>

            <div class="info-note">
                <i class="fas fa-mobile-alt"></i>
                <span>بدون كلمة مرور؟ يمكنك تسجيل الدخول برقم الجوال عبر <strong>"إنشاء حساب"</strong> لاستخدام رمز التحقق.</span>
            </div>
        </div>

        <!-- نموذج إنشاء حساب / تسجيل -->
        <div id="register-panel" class="form-card">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="reg-name" placeholder="الاسم الكامل">
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="البريد الإلكتروني (اختياري)">
            </div>
            <div class="input-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" id="reg-phone" placeholder="رقم الجوال *" dir="ltr">
            </div>
            <div class="otp-wrapper">
                <input type="text" id="reg-otp-code" placeholder="رمز التحقق" maxlength="6" dir="ltr">
                <button class="send-otp-btn" id="send-otp-btn">إرسال رمز</button>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="reg-password" placeholder="كلمة المرور">
            </div>
            <button class="btn-primary" id="register-submit-btn">
                <i class="fas fa-user-plus"></i> إنشاء حساب
            </button>

            <div class="divider">أو التسجيل عبر</div>
            <button class="btn-outline-google" id="google-reg-btn">
                <i class="fab fa-google"></i> التسجيل بحساب Google
            </button>
            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى المتجر</a>
            </div>
        </div>
    </div>
</div>

<div id="toastMessage" class="toast-msg"></div>

<script>
    // ----------  محاكاة تخزين المستخدمين (localStorage) ----------
    const USERS_STORAGE = "azzam_users";
    const SESSION_KEY = "azzam_current_user";

    // تهيئة المستخدمين الافتراضيين (اختبار)
    function initDefaultUsers() {
        let users = localStorage.getItem(USERS_STORAGE);
        if (!users) {
            const defaultUsers = [
                {
                    id: "user_1",
                    name: "أحمد محمد",
                    email: "ahmed@example.com",
                    phone: "01010022271",
                    password: "123456",   // عملياً يتم تشفيرها لكن للعرض فقط
                    provider: "local",
                    createdAt: new Date().toISOString()
                }
            ];
            localStorage.setItem(USERS_STORAGE, JSON.stringify(defaultUsers));
            return defaultUsers;
        }
        return JSON.parse(users);
    }

    function getUsers() {
        return JSON.parse(localStorage.getItem(USERS_STORAGE) || "[]");
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_STORAGE, JSON.stringify(users));
    }

    function setCurrentUser(user) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }

    function getCurrentUser() {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) {
            try {
                return JSON.parse(raw);
            } catch(e) { return null; }
        }
        return null;
    }

    // عرض رسائل منبثقة
    function showMessage(text, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.textContent = text;
        toast.style.backgroundColor = isError ? '#b91c1c' : '#0f3b2c';
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // تسجيل الدخول بكلمة مرور
    function loginWithPassword(phone, password) {
        if (!phone || !password) {
            showMessage("يرجى إدخال رقم الجوال وكلمة المرور", true);
            return false;
        }
        const users = getUsers();
        const user = users.find(u => u.phone === phone && u.password === password);
        if (user) {
            setCurrentUser(user);
            showMessage(`مرحباً ${user.name}، تم تسجيل الدخول بنجاح!`);
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
            return true;
        } else {
            showMessage("رقم الجوال أو كلمة المرور غير صحيحة", true);
            return false;
        }
    }

    // إنشاء حساب برقم الجوال ورمز التحقق (محاكاة OTP)
    let pendingVerification = null; // { phone, name, email, password, otpCode }
    let lastOtpSentTime = 0;

    function generateOtp() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function sendOtpToPhone(phone) {
        // محاكاة إرسال رمز (في الإنتاج يتم الاتصال بـ API)
        const otp = generateOtp();
        pendingVerification = { ...pendingVerification, phone, otpCode: otp };
        console.log(`[محاكاة] رمز التحقق لرقم ${phone} هو: ${otp}`);
        showMessage(`تم إرسال رمز التحقق: ${otp} (تجريبي)`);
        return otp;
    }

    // تسجيل مستخدم جديد (بعد التحقق من الرمز)
    function registerUserWithPhone(name, email, phone, password, enteredOtp) {
        if (!phone || !name) {
            showMessage("الاسم ورقم الجوال مطلوبان", true);
            return false;
        }
        if (!pendingVerification || pendingVerification.phone !== phone) {
            showMessage("الرجاء طلب رمز التحقق أولاً", true);
            return false;
        }
        if (pendingVerification.otpCode !== enteredOtp) {
            showMessage("رمز التحقق غير صحيح", true);
            return false;
        }
        // التحقق من عدم وجود الحساب مسبقاً
        const users = getUsers();
        const exists = users.find(u => u.phone === phone);
        if (exists) {
            showMessage("رقم الجوال مسجل بالفعل، يرجى تسجيل الدخول", true);
            return false;
        }
        const newUser = {
            id: "user_" + Date.now() + Math.floor(Math.random() * 10000),
            name: name.trim(),
            email: email || "",
            phone: phone,
            password: password || "",   // يمكن أن يترك فارغًا، ويمكنه تسجيل الدخول بكلمة مرور أو OTP لاحقًا
            provider: "local",
            createdAt: new Date().toISOString()
        };
        users.push(newUser);
        saveUsers(users);
        setCurrentUser(newUser);
        pendingVerification = null;
        showMessage(`أهلاً ${newUser.name}! تم إنشاء حسابك بنجاح.`);
        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);
        return true;
    }

    // تسجيل الدخول عبر Google (محاكاة OAuth)
    function googleSignIn(redirectAfter = true) {
        // محاكاة بيانات من Google (في الإنتاج يتم استخدام Google Identity Services SDK)
        const mockGoogleUser = {
            id: "google_" + Date.now(),
            name: "مستخدم Google",
            email: "user@gmail.com",
            phone: "",
            password: null,
            provider: "google",
            avatar: null
        };
        // التحقق إذا كان البريد موجوداً بالفعل
        const users = getUsers();
        let existing = users.find(u => u.email === mockGoogleUser.email && u.provider === "google");
        if (!existing) {
            // إنشاء مستخدم جديد
            const newGoogleUser = {
                ...mockGoogleUser,
                id: "google_" + Date.now(),
                name: "مستخدم Google",
                email: "user@gmail.com",
                phone: null,
                provider: "google"
            };
            users.push(newGoogleUser);
            saveUsers(users);
            setCurrentUser(newGoogleUser);
        } else {
            setCurrentUser(existing);
        }
        showMessage(`تم تسجيل الدخول بحساب Google بنجاح!`);
        if (redirectAfter) {
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }
        return true;
    }

    // دالة للتحقق من صحة رقم الجوال
    function isValidPhone(phone) {
        const phoneRegex = /^01[0-9]{9}$/;   // أرقام مصرية 11 رقم
        return phoneRegex.test(phone);
    }

    // --- ربط الأحداث ---
    document.addEventListener('DOMContentLoaded', () => {
        initDefaultUsers();

        // التبويبات
        const tabs = document.querySelectorAll('.tab-btn');
        const loginPanel = document.getElementById('login-panel');
        const registerPanel = document.getElementById('register-panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.getAttribute('data-tab');
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (target === 'login') {
                    loginPanel.classList.add('active-form');
                    registerPanel.classList.remove('active-form');
                } else {
                    registerPanel.classList.add('active-form');
                    loginPanel.classList.remove('active-form');
                    // إعادة تعيين حالة التحقق عند التبديل
                    pendingVerification = null;
                }
            });
        });

        // زر تسجيل الدخول بكلمة المرور
        const loginBtn = document.getElementById('login-with-pass-btn');
        loginBtn.addEventListener('click', () => {
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;
            loginWithPassword(phone, password);
        });

        // إدخال Enter في حقول تسجيل الدخول
        const loginPhoneInput = document.getElementById('login-phone');
        const loginPassInput = document.getElementById('login-password');
        const handleLoginEnter = (e) => {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        };
        loginPhoneInput.addEventListener('keypress', handleLoginEnter);
        loginPassInput.addEventListener('keypress', handleLoginEnter);

        // تسجيل الدخول عبر Google (من لوحة تسجيل الدخول)
        const googleLoginBtn = document.getElementById('google-login-btn');
        googleLoginBtn.addEventListener('click', () => googleSignIn(true));

        // ----- تسجيل حساب جديد (OTP + بيانات) -----
        const sendOtpBtn = document.getElementById('send-otp-btn');
        const regPhoneInput = document.getElementById('reg-phone');
        const regNameInput = document.getElementById('reg-name');
        const regEmailInput = document.getElementById('reg-email');
        const regPasswordInput = document.getElementById('reg-password');
        const regOtpInput = document.getElementById('reg-otp-code');
        const registerSubmit = document.getElementById('register-submit-btn');

        // إرسال رمز التحقق
        sendOtpBtn.addEventListener('click', () => {
            const phone = regPhoneInput.value.trim();
            if (!isValidPhone(phone)) {
                showMessage("الرجاء إدخال رقم جوال مصري صحيح (11 رقم يبدأ بـ 01)", true);
                return;
            }
            // التحقق من أن الرقم غير مسجل مسبقاً (اختياري لكن مفيد)
            const users = getUsers();
            if (users.find(u => u.phone === phone)) {
                showMessage("رقم الجوال مسجل بالفعل، يرجى تسجيل الدخول", true);
                return;
            }
            const name = regNameInput.value.trim();
            if (!name) {
                showMessage("الرجاء إدخال الاسم الكامل قبل إرسال الرمز", true);
                return;
            }
            // حفظ البيانات المؤقتة
            pendingVerification = {
                name: name,
                email: regEmailInput.value.trim(),
                phone: phone,
                password: regPasswordInput.value,
                otpCode: null
            };
            const sentOtp = sendOtpToPhone(phone);
            // نحدث الكود في الكائن المؤقت
            pendingVerification.otpCode = sentOtp;
            showMessage("تم إرسال رمز التحقق، أدخله في الحقل أدناه", false);
        });

        // إنشاء الحساب بعد إدخال الرمز
        registerSubmit.addEventListener('click', () => {
            const phone = regPhoneInput.value.trim();
            const name = regNameInput.value.trim();
            const email = regEmailInput.value.trim();
            const password = regPasswordInput.value;
            const otp = regOtpInput.value.trim();

            if (!isValidPhone(phone)) {
                showMessage("رقم الجوال غير صحيح (يبدأ بـ 01 ويتكون من 11 رقم)", true);
                return;
            }
            if (!name) {
                showMessage("الاسم الكامل مطلوب", true);
                return;
            }
            if (!otp) {
                showMessage("أدخل رمز التحقق المرسل إلى جوالك", true);
                return;
            }
            // التأكد من تطابق الرقم مع رقم الانتظار
            if (!pendingVerification || pendingVerification.phone !== phone) {
                showMessage("يرجى طلب رمز تحقق جديد لهذا الرقم أولاً", true);
                return;
            }
            registerUserWithPhone(name, email, phone, password, otp);
        });

        // تسجيل عبر Google من لوحة التسجيل
        const googleRegBtn = document.getElementById('google-reg-btn');
        googleRegBtn.addEventListener('click', () => googleSignIn(true));

        // تحسينات تجربة: عند الضغط على إنشاء حساب إذا كان رقم الجوال صالحاً يمكن طلب الرمز بسهولة
        regPhoneInput.addEventListener('blur', () => {
            const phone = regPhoneInput.value.trim();
            if (phone && isValidPhone(phone)) {
                // فقط إشارة غير ملزمة
                if (getUsers().find(u => u.phone === phone)) {
                    showMessage("هذا الرقم مسجل بالفعل، يمكنك تسجيل الدخول مباشرة", true);
                }
            }
        });

        // عند فتح الصفحة، إذا كان هناك مستخدم جالس بالفعل ممكن توجيهه تلقائياً للمتجر
        const current = getCurrentUser();
        if (current && window.location.pathname.includes('auth.html')) {
            // لا نوجه تلقائياً لتجنب loop، لكن نعرض رسالة
            setTimeout(() => {
                if (confirm(`مرحباً ${current.name}، هل تريد الذهاب إلى المتجر؟`)) {
                    window.location.href = "index.html";
                }
            }, 400);
        }
    });
</script>
</body>
</html>
