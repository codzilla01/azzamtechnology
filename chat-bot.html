<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azzam Technology | المساعد الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e63946; --dark: #1a1a2e; --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --radius: 20px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .chat-page {
            width: 100%; max-width: 780px; height: 90vh; max-height: 700px; background: var(--card);
            border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,0.4); display: flex;
            flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header .brand { display: flex; align-items: center; gap: 10px; }
        .chat-header .brand-icon {
            width: 42px; height: 42px; background: var(--primary); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.88rem; line-height: 1.6; animation: in 0.3s ease; }
        @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { background: #fff; align-self: flex-start; border-bottom-right-radius: 4px; color: #1e293b; border: 1px solid #e2e8f0; }
        .msg.user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
        .msg .hl { color: var(--primary); font-weight: 700; }
        .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .quick-chip {
            background: #fff; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer;
            font-weight: 600; font-family: 'Tajawal', sans-serif;
        }
        .quick-chip:hover { background: var(--primary); color: #fff; }
        .chat-input-area { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 25px; font-size: 0.9rem; font-family: inherit; outline: none; }
        .chat-input-area button { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); border: none; color: #fff; cursor: pointer; font-size: 1rem; }
        .chat-footer { text-align: center; padding: 8px; font-size: 0.75rem; color: var(--muted); background: #f1f5f9; border-top: 1px solid var(--border); }
        @media (max-width: 600px) { .chat-page { height: 100vh; max-height: 100vh; border-radius: 0; } }
    </style>
</head>
<body>
    <div class="chat-page">
        <div class="chat-header">
            <a href="index.html" class="brand" style="text-decoration:none;color:#fff;">
                <div class="brand-icon"><i class="fas fa-microchip"></i></div>
                <div><h3 style="font-size:1rem;">Azzam Technology</h3><p style="font-size:0.7rem;opacity:0.7;">المساعد الذكي</p></div>
            </a>
            <a href="index.html" style="color:#fff;font-size:1.2rem;"><i class="fas fa-home"></i></a>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="msg bot">👋 مرحباً! أنا مساعد <span class="hl">Azzam Technology</span>. اسألني عن الأسعار، المواصفات، التجميع، أو أي استفسار!</div>
            <div class="quick-chips">
                <button class="quick-chip" data-q="أسعار اللابتوبات">💻 اللابتوبات</button>
                <button class="quick-chip" data-q="الشاشات المتاحة">🖥️ الشاشات</button>
                <button class="quick-chip" data-q="تجميع PC">🔧 تجميع PC</button>
                <button class="quick-chip" data-q="الضمان">🛡️ الضمان</button>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب سؤالك هنا...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="chat-footer">📞 01025555207 | 📍 مول البستان - القاهرة</div>
    </div>
    <script>
        const $ = s => document.querySelector(s);
        const STORAGE_KEY = 'store_all_products', CHATBOT_KEY = 'chatbot_data';

        function getProducts() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
        function getChatbot() { try { return JSON.parse(localStorage.getItem(CHATBOT_KEY)) || null; } catch(e) { return null; } }

        function getResponse(msg) {
            const products = getProducts(), chatbot = getChatbot(), m = msg.toLowerCase().trim();
            if (chatbot?.qa) for (const qa of chatbot.qa) if (qa.keywords?.some(k => m.includes(k.toLowerCase()))) return qa.response;
            if (/مرحبا|السلام|اهلا/.test(m)) return '👋 أهلاً! كيف أساعدك؟';
            if (/ضمان|استبدال/.test(m)) return '🛡️ الشاشات وPC: شهر (استبدال) | اللابتوبات: 3 شهور | البطارية: شهر';
            if (/توصيل|شحن/.test(m)) return '🚚 نوصل لكل مصر! مجاني فوق 5000 ج.م';
            if (/رقم|هاتف|عنوان/.test(m)) return '📞 01025555207 | 📍 مول البستان - القاهرة';
            const laps = products.filter(p => p.type === 'laptop');
            if (/لابتوب|لاب/.test(m)) return laps.length ? '💻 اللابتوبات:\n' + laps.slice(0,5).map((l,i) => `${i+1}. ${l.name}: ${l.price.toLocaleString()} ج.م`).join('\n') : '⚠️ لا توجد لابتوبات';
            const mons = products.filter(p => p.type === 'monitor');
            if (/شاشة|شاشات/.test(m)) return mons.length ? '🖥️ الشاشات:\n' + mons.slice(0,5).map((mo,i) => `${i+1}. ${mo.name}: ${mo.price.toLocaleString()} ج.م`).join('\n') : '⚠️ لا توجد شاشات';
            if (/تجميع|build/.test(m)) return '🔧 توجه لقسم تجميع PC في موقعنا!';
            if (/سعر|بكام/.test(m) && products.length) {
                const cheap = products.reduce((a,b) => a.price < b.price ? a : b);
                const exp = products.reduce((a,b) => a.price > b.price ? a : b);
                return `💰 الأرخص: ${cheap.name} - ${cheap.price.toLocaleString()} ج.م\n💎 الأعلى: ${exp.name} - ${exp.price.toLocaleString()} ج.م`;
            }
            const found = products.filter(p => p.name?.toLowerCase().includes(m));
            if (found.length) return '🔍 نتائج:\n' + found.slice(0,5).map((f,i) => `${i+1}. ${f.name}: ${f.price.toLocaleString()} ج.م`).join('\n');
            return '🤔 اسألني عن: اللابتوبات | الشاشات | تجميع PC | الضمان | الأسعار';
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            const body = $('#chatBody');
            body.querySelector('.quick-chips')?.remove();
            const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
            $('#chatInput').value = '';
            await new Promise(r => setTimeout(r, 500 + Math.random() * 500));
            const b = document.createElement('div'); b.className = 'msg bot'; b.innerHTML = getResponse(text).replace(/\n/g, '<br>');
            body.appendChild(b);
            body.scrollTop = body.scrollHeight;
        }

        $('#sendBtn').addEventListener('click', () => sendMessage($('#chatInput').value));
        $('#chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage($('#chatInput').value); });
        document.querySelectorAll('.quick-chip').forEach(c => c.addEventListener('click', () => sendMessage(c.dataset.q)));
        console.log('✅ المساعد الذكي جاهز');
    </script>
</body>
</html>
