<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="Azzam Technology | المساعد الذكي">Azzam Technology | المساعد الذكي</title>
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/vendor/tajawal/tajawal.css">
    <link rel="stylesheet" href="i18n.css">
    <script src="i18n.js"></script>
    <style>
        :root { --primary: #c72c3c; --dark: #1a1a2e; --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --radius: 20px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .chat-page {
            width: 100%; max-width: 780px; height: 90vh; max-height: 700px; background: var(--card);
            border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,0.4); display: flex;
            flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header-actions { display: flex; align-items: center; gap: 14px; }
        .chat-header .brand { display: flex; align-items: center; gap: 10px; }
        .chat-header .brand-icon {
            width: 42px; height: 42px; background: var(--primary); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.88rem; line-height: 1.6; animation: in 0.3s ease; }
        @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { background: #fff; align-self: flex-start; border-bottom-right-radius: 4px; color: #1e293b; border: 1px solid #e2e8f0; }
        .msg.user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
        .msg .hl { color: var(--primary); font-weight: 700; }
        .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .quick-chip {
            background: #fff; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer;
            font-weight: 600; font-family: 'Tajawal', sans-serif;
        }
        .quick-chip:hover { background: var(--primary); color: #fff; }
        .chat-input-area { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 25px; font-size: 0.9rem; font-family: inherit; outline: none; }
        .chat-input-area button { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); border: none; color: #fff; cursor: pointer; font-size: 1rem; }
        .chat-footer { text-align: center; padding: 8px; font-size: 0.75rem; color: #526277; background: #f1f5f9; border-top: 1px solid var(--border); }
        .msg { white-space: pre-line; overflow-wrap: anywhere; }
        .chat-input-area input:focus-visible, .chat-input-area button:focus-visible, .quick-chip:focus-visible, a:focus-visible { outline: 3px solid #ed6973; outline-offset: 3px; }
        [dir="ltr"] .msg.bot { border-bottom-right-radius: 14px; border-bottom-left-radius: 4px; }
        [dir="ltr"] .msg.user { border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }
        @media (max-width: 360px) { .chat-header { padding-inline: 12px; } .chat-header-actions { gap: 9px; } .chat-header .brand { gap: 6px; } }
        @media (max-width: 600px) { body { padding: 0; } .chat-page { height: 100vh; height: 100dvh; max-height: none; border-radius: 0; } }
        @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
    </style>
</head>
<body>
    <div class="chat-page">
        <div class="chat-header">
            <a href="index.html" class="brand" style="text-decoration:none;color:#fff;">
                <div class="brand-icon"><i class="fas fa-microchip"></i></div>
                <div><h3 style="font-size:1rem;">Azzam Technology</h3><p style="font-size:0.7rem;opacity:0.7;"><span data-i18n="المساعد الذكي">المساعد الذكي</span></p></div>
            </a>
            <div class="chat-header-actions">
                <button type="button" class="language-switch" data-language-switch aria-label="EN — Switch to English" title="EN — Switch to English"><i class="fa-solid fa-globe" aria-hidden="true"></i><span data-language-label lang="en">EN</span></button>
                <a href="index.html" aria-label="العودة إلى المتجر" style="color:#fff;font-size:1.2rem;" data-i18n-aria-label="العودة إلى المتجر"><i class="fas fa-home" aria-hidden="true"></i></a>
            </div>
        </div>
        <div class="chat-body" id="chatBody" role="log" aria-live="polite" aria-label="محادثة المساعد" data-i18n-aria-label="محادثة المساعد">
            <div class="msg bot"><span data-i18n="👋 مرحباً! أنا مساعد">👋 مرحباً! أنا مساعد</span> <span class="hl">Azzam Technology</span><span data-i18n=". اسألني عن الأسعار، المواصفات، التجميع، أو أي استفسار!">. اسألني عن الأسعار، المواصفات، التجميع، أو أي استفسار!</span></div>
            <div class="quick-chips">
                <button class="quick-chip" data-q="أسعار اللابتوبات" data-i18n-data-q="أسعار اللابتوبات"><span data-i18n="💻 اللابتوبات">💻 اللابتوبات</span></button>
                <button class="quick-chip" data-q="الشاشات المتاحة" data-i18n-data-q="الشاشات المتاحة"><span data-i18n="🖥️ الشاشات">🖥️ الشاشات</span></button>
                <button class="quick-chip" data-q="تجميع PC" data-i18n-data-q="تجميع PC"><span data-i18n="🔧 تجميع PC">🔧 تجميع PC</span></button>
                <button class="quick-chip" data-q="الضمان" data-i18n-data-q="الضمان"><span data-i18n="🛡️ الضمان">🛡️ الضمان</span></button>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" dir="auto" aria-label="اكتب سؤالك للمساعد" placeholder="اكتب سؤالك هنا..." data-i18n-placeholder="اكتب سؤالك هنا..." data-i18n-aria-label="اكتب سؤالك للمساعد">
            <button type="button" id="sendBtn" aria-label="إرسال السؤال" data-i18n-aria-label="إرسال السؤال"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <div class="chat-footer"><span data-i18n="📞 01025555207 | 📍 مول البستان - القاهرة">📞 01025555207 | 📍 مول البستان - القاهرة</span></div>
    </div>
    <script>
        const $ = s => document.querySelector(s);
        const STORAGE_KEY = 'store_all_products', CHATBOT_KEY = 'chatbot_data';
        const t = I18n.t;

        function getProducts() {
            try {
                const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(value) ? value.filter(product => product && typeof product === 'object') : [];
            } catch (error) { return []; }
        }
        function getChatbot() { try { return JSON.parse(localStorage.getItem(CHATBOT_KEY)) || null; } catch (error) { return null; } }
        function productName(product) { return I18n.productText(product, 'name') || t('منتج'); }
        function productList(items) {
            return items.slice(0, 5).map((product, index) => `${index + 1}. ${productName(product)}: ${I18n.formatPrice(product.price)}`).join('\n');
        }

        function getResponse(msg) {
            const products = getProducts(), chatbot = getChatbot();
            const m = msg.toLowerCase().trim();
            if (Array.isArray(chatbot?.qa)) {
                for (const qa of chatbot.qa) {
                    if (Array.isArray(qa.keywords) && qa.keywords.some(keyword => typeof keyword === 'string' && m.includes(keyword.toLowerCase()))) return qa.response || '';
                }
            }
            if (/مرحبا|السلام|اهلا|أهلا|\b(hi|hello|hey)\b/.test(m)) return t('👋 أهلاً! كيف أساعدك؟');
            if (/ضمان|استبدال|\b(warranty|guarantee|replacement)\b/.test(m)) return t('🛡️ الشاشات وPC: شهر (استبدال) | اللابتوبات: 3 شهور | البطارية: شهر');
            if (/توصيل|شحن|\b(delivery|deliver|shipping|ship)\b/.test(m)) return t('🚚 نوصل لكل مصر! مجاني فوق 5000 ج.م');
            if (/رقم|هاتف|عنوان|\b(phone|telephone|contact|address|location)\b/.test(m)) return t('📞 01025555207 | 📍 مول البستان - القاهرة');
            const laptops = products.filter(product => product.type === 'laptop');
            if (/لابتوب|لاب|\b(laptop|laptops|notebook|notebooks)\b/.test(m)) return laptops.length ? t('💻 اللابتوبات:') + '\n' + productList(laptops) : t('⚠️ لا توجد لابتوبات');
            const monitors = products.filter(product => ['monitor', 'frameless', 'curved', 'gaming'].includes(product.type));
            if (/شاشة|شاشات|\b(monitor|monitors|screen|screens|display|displays)\b/.test(m)) return monitors.length ? t('🖥️ الشاشات:') + '\n' + productList(monitors) : t('⚠️ لا توجد شاشات');
            if (/تجميع|\b(build|custom|assemble|assembly)\b/.test(m)) return t('🔧 توجه لقسم تجميع PC في موقعنا!');
            if ((/سعر|أسعار|بكام|\b(price|prices|pricing|cost|costs)\b/.test(m)) && products.length) {
                const cheap = products.reduce((a, b) => Number(a.price) < Number(b.price) ? a : b);
                const expensive = products.reduce((a, b) => Number(a.price) > Number(b.price) ? a : b);
                return t('💰 الأرخص: {cheap} - {cheapPrice}\n💎 الأعلى: {expensive} - {expensivePrice}', {
                    cheap: productName(cheap), cheapPrice: I18n.formatPrice(cheap.price),
                    expensive: productName(expensive), expensivePrice: I18n.formatPrice(expensive.price)
                });
            }
            const found = products.filter(product => [product.name, product.translations?.en?.name]
                .some(name => typeof name === 'string' && name.toLowerCase().includes(m)));
            if (found.length) return t('🔍 نتائج:') + '\n' + productList(found);
            return t('🤔 اسألني عن: اللابتوبات | الشاشات | تجميع PC | الضمان | الأسعار');
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            const body = $('#chatBody');
            body.querySelector('.quick-chips')?.remove();
            const u = document.createElement('div'); u.className = 'msg user'; u.dir = 'auto'; u.textContent = text; body.appendChild(u);
            $('#chatInput').value = '';
            await new Promise(r => setTimeout(r, 500 + Math.random() * 500));
            const b = document.createElement('div'); b.className = 'msg bot'; b.dir = 'auto'; b.dataset.question = text; b.textContent = getResponse(text);
            body.appendChild(b);
            body.scrollTop = body.scrollHeight;
        }

        document.addEventListener('azzam:languagechange', () => {
            document.querySelectorAll('.msg.bot[data-question]').forEach(message => { message.textContent = getResponse(message.dataset.question); });
        });

        $('#sendBtn').addEventListener('click', () => sendMessage($('#chatInput').value));
        $('#chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage($('#chatInput').value); });
        document.querySelectorAll('.quick-chip').forEach(c => c.addEventListener('click', () => sendMessage(c.dataset.q)));
        console.log('✅ المساعد الذكي جاهز');
    </script>
</body>
</html>
